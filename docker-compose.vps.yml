# Production stack for a single VPS: one Postgres with a database per project, the 4 APIs on the
# internal network only, and the gateway bound to localhost for the host's nginx to proxy (with TLS).
# Secrets come from .env next to this file — see vps/env.ejemplo.
name: portafolio

x-api: &api
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./vps/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  expenses-api:
    <<: *api
    build: ../APIAutomatizacionAI
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/expenses_db
      # Without it the APIs start, but report/ticket calls return 502.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-unset}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      API_KEY: ${API_KEY:?set API_KEY in .env}
      UVICORN_ROOT_PATH: /expenses

  support-api:
    <<: *api
    build: ../BotAutomatizacionDiaria
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/tickets_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-unset}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      API_KEY: ${API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
      UVICORN_ROOT_PATH: /support

  storage-api:
    <<: *api
    build: ../AlmacenamientoCDN
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/storage_db
      API_KEY: ${API_KEY}
      # Without real AWS values the API runs and /storage/docs works, but uploads return 502.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-unset}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-unset}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-unset}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-unset.cloudfront.net}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-unset}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-unset}
      UVICORN_ROOT_PATH: /storage

  billing-api:
    <<: *api
    build: ../PasarelaPagoFacturacion
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/payments_db
      API_KEY: ${API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_unset}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_unset}
      CHECKOUT_SUCCESS_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}/payments/
      CHECKOUT_CANCEL_URL: ${PUBLIC_URL}/payments/?cancelled=1
      UVICORN_ROOT_PATH: /billing

  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8120:80"
    environment:
      EXPENSES_UPSTREAM: expenses-api:8000
      SUPPORT_UPSTREAM: support-api:8000
      STORAGE_UPSTREAM: storage-api:8000
      BILLING_UPSTREAM: billing-api:8000
      # Injected by nginx on the /demo/* routes only; never sent to the browser.
      DEMO_API_KEY: ${API_KEY}
      DEMO_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    depends_on:
      - expenses-api
      - support-api
      - storage-api
      - billing-api

volumes:
  db-data:
