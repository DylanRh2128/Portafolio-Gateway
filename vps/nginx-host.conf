# Host nginx site: copy to /etc/nginx/sites-enabled/portafolio.conf, replace the server_name,
# then `nginx -t && systemctl reload nginx && certbot --nginx -d <server_name>`.
server {
    listen 80;
    server_name portafolio.169-58-36-243.sslip.io;
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
