# Local smoke test only: confirms the gateway routes correctly to each service.
# Uses SQLite per service here purely to avoid spinning up 4 Postgres instances just to test
# routing — the VPS deployment (docker-compose.vps.yml) uses a real Postgres.
services:
  gateway:
    build: .
    ports:
      - "8080:80"
    environment:
      EXPENSES_UPSTREAM: expenses-api:8000
      SUPPORT_UPSTREAM: support-api:8000
      STORAGE_UPSTREAM: storage-api:8000
      BILLING_UPSTREAM: billing-api:8000
      # Injected by nginx on the /demo/* routes only; never sent to the browser.
      DEMO_API_KEY: test
      DEMO_WEBHOOK_SECRET: test
    depends_on:
      - expenses-api
      - support-api
      - storage-api
      - billing-api

  expenses-api:
    build: ../APIAutomatizacionAI
    environment:
      UVICORN_ROOT_PATH: /expenses  # so /docs fetches /expenses/openapi.json
      DATABASE_URL: sqlite:////tmp/expenses.db
      OPENAI_API_KEY: test
      API_KEY: test

  support-api:
    build: ../BotAutomatizacionDiaria
    environment:
      UVICORN_ROOT_PATH: /support  # so /docs fetches /support/openapi.json
      DATABASE_URL: sqlite:////tmp/support.db
      OPENAI_API_KEY: test
      WEBHOOK_SECRET: test
      API_KEY: test

  storage-api:
    build: ../AlmacenamientoCDN
    environment:
      UVICORN_ROOT_PATH: /storage  # so /docs fetches /storage/openapi.json
      DATABASE_URL: sqlite:////tmp/storage.db
      API_KEY: test
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: test
      CLOUDFRONT_DOMAIN: test.cloudfront.net
      CLOUDFRONT_KEY_PAIR_ID: test
      CLOUDFRONT_PRIVATE_KEY: test

  billing-api:
    build: ../PasarelaPagoFacturacion
    environment:
      UVICORN_ROOT_PATH: /billing  # so /docs fetches /billing/openapi.json
      DATABASE_URL: sqlite:////tmp/billing.db
      API_KEY: test
      STRIPE_SECRET_KEY: sk_test_x
      STRIPE_WEBHOOK_SECRET: whsec_test
      CHECKOUT_SUCCESS_URL: http://localhost:8080/payments/
      CHECKOUT_CANCEL_URL: http://localhost:8080/payments/?cancelled=1
